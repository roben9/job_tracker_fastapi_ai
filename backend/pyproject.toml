[project]
name = "job-tracker"
version = "0.1.0"
description = "Track My Job Applications"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.165.0",
    "pwdlib[argon2]>=0.4.2",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.9",
]

[tool.fastapi]
entrypoint ="app.main:app"
